
name: Build and publish firmware

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install board platform and libraries
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.0.7 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib install ArduinoJson@6.21.5
          mkdir -p "$HOME/Arduino/libraries"
          git clone --depth 1 --branch V3.1.0 https://github.com/Seeed-Studio/Seeed_GFX.git "$HOME/Arduino/libraries/Seeed_GFX"

      - name: Prepare versioned sketch
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          version="0.1.2"
          if [[ "$REF_TYPE" == "tag" ]]; then
            version="${RELEASE_TAG#v}"
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Tag must use vMAJOR.MINOR.PATCH, for example v1.2.3" >&2
              exit 1
            fi
          fi
          mkdir -p "$RUNNER_TEMP/epaper"
          cp epaper.ino driver.h ota_update.h ota_certs.h partitions.csv "$RUNNER_TEMP/epaper/"
          cp config.example.h "$RUNNER_TEMP/epaper/config.h"
          printf '#pragma once\n#define FIRMWARE_VERSION "%s"\n' "$version" > "$RUNNER_TEMP/epaper/firmware_version.h"

      - name: Compile for XIAO ESP32-C3
        run: |
          mkdir -p dist
          arduino-cli compile \
            --fqbn esp32:esp32:XIAO_ESP32C3 \
            --libraries "$HOME/Arduino/libraries" \
            --output-dir dist \
            "$RUNNER_TEMP/epaper"
          firmware_bin="dist/epaper.ino.bin"
          test -f "$firmware_bin"
          firmware_size="$(stat -c%s "$firmware_bin")"
          if (( firmware_size > 1966080 )); then
            echo "Firmware image exceeds the 1.875 MiB OTA slot: ${firmware_size} bytes" >&2
            exit 1
          fi
          image_magic="$(od -An -tx1 -N1 "$firmware_bin" | tr -d '[:space:]')"
          if [[ "$image_magic" != "e9" ]]; then
            echo "Selected file is not an ESP32 app image (magic: ${image_magic})" >&2
            exit 1
          fi
          cp "$firmware_bin" dist/epaper-dashboard-xiao-esp32c3.bin
          ls -lh dist/epaper-dashboard-xiao-esp32c3.bin

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/epaper-dashboard-xiao-esp32c3.bin
